name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skill structure, links and rule catalog
        run: python scripts/validate.py
      - name: Unit tests (engine and every catalog rule)
        run: python -m unittest discover -s tests -p "test_*.py"
